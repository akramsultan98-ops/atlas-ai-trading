[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "ATLAS V2 - a strategy factory for Binance spot with a hard AI containment boundary"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
# The advisory plane only. The control plane must run without it (AI-08).
research = [
    "anthropic>=0.70",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[[tool.mypy.overrides]]
# Optional extra: the control plane must typecheck and run without it installed.
module = ["anthropic.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["atlas"]
warn_unreachable = true
disallow_any_generics = true
